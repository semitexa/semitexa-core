# Audit the dependencies this package asks a consumer to install.
#
# There is no lock file here — this is a library, so the versions a consumer
# actually resolves depend on their own tree. The audit therefore resolves the
# constraints fresh and checks the result, which is the closest a library can
# get to "what would somebody installing this today receive".
#
# Runtime dependencies only (`--no-dev`): a development-time advisory in phpunit
# is not something a consumer of this package is exposed to, and a gate that
# fires on it teaches people to ignore the gate.
#
# The schedule matters more than the push trigger. An advisory is published
# against code that has not changed, so a check that only runs on commit will
# not see it until somebody happens to commit.
name: Security audit

on:
  push:
    branches: [master, develop]
  pull_request:
  schedule:
    # Mondays, 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Read-only, and no secrets are used: this workflow only ever needs the code it
# is auditing.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs, not tags: a tag is mutable, and the action it
      # names runs with this workflow's token. The comment carries the version
      # the SHA was, because a bare SHA tells a later reader nothing about what
      # it is or whether it has moved on.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (2026-07-16)
        with:
          # Nothing after this step needs git credentials, and a compromised
          # Composer plugin running during `composer update` could read the
          # token actions/checkout persists in .git/config otherwise.
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 (2026-06-08)
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      # --no-scripts AND --no-plugins. The first stops composer running the
      # scripts a package declares; it does NOT stop a plugin, which is ordinary
      # PHP that composer loads and executes as part of resolution — including
      # the one this package ships and any a dependency brings with it. An audit
      # that runs the code it is auditing is not an audit.
      - name: Resolve runtime dependencies
        run: composer update --no-dev --no-scripts --no-plugins --no-interaction --no-progress --prefer-dist

      - name: Audit
        run: composer audit --no-interaction
